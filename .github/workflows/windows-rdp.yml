name: Windows RDP

on:
  workflow_dispatch:

jobs:
  rdp:
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Check secrets
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          if ([string]::IsNullOrEmpty($env:RDP_PASSWORD)) {
            Write-Error "Secret RDP_PASSWORD mancante: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          }
          if ($env:RDP_PASSWORD.Length -lt 8) {
            Write-Error "RDP_PASSWORD troppo corta: servono almeno 8 caratteri"
            exit 1
          }
          $cats = 0
          if ($env:RDP_PASSWORD -cmatch '[A-Z]') { $cats++ }
          if ($env:RDP_PASSWORD -cmatch '[a-z]') { $cats++ }
          if ($env:RDP_PASSWORD -match '[0-9]') { $cats++ }
          if ($env:RDP_PASSWORD -match '[^A-Za-z0-9]') { $cats++ }
          if ($cats -lt 3) {
            Write-Error "RDP_PASSWORD troppo debole: servono almeno 3 di questi 4 gruppi: maiuscole, minuscole, numeri, simboli (es. Rdp#2026!Vm)"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:TS_AUTHKEY)) {
            Write-Error "Secret TAILSCALE_AUTHKEY mancante: Settings > Secrets and variables > Actions > New repository secret"
            exit 1
          }
          Write-Host "Secrets OK"

      - name: Enable RDP
        shell: powershell
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1

      - name: Create RDP user
        shell: powershell
        env:
          RDP_PASSWORD: ${{ secrets.RDP_PASSWORD }}
        run: |
          $secure = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          if (Get-LocalUser -Name 'rdpuser' -ErrorAction SilentlyContinue) {
            Set-LocalUser -Name 'rdpuser' -Password $secure
          } else {
            New-LocalUser -Name 'rdpuser' -Password $secure -AccountNeverExpires
          }
          Add-LocalGroupMember -Group 'Administrators' -Member 'rdpuser' -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'rdpuser' -ErrorAction SilentlyContinue

      - name: Install Tailscale
        shell: powershell
        run: |
          Invoke-WebRequest -Uri 'https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe' -OutFile "$env:TEMP\tailscale-setup.exe"
          Start-Process -FilePath "$env:TEMP\tailscale-setup.exe" -ArgumentList '/quiet' -Wait

      - name: Connect to Tailscale
        shell: powershell
        env:
          TS_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          & 'C:\Program Files\Tailscale\tailscale.exe' up --authkey=$env:TS_AUTHKEY --hostname=gh-rdp --accept-routes
          $ip = & 'C:\Program Files\Tailscale\tailscale.exe' ip -4
          Write-Host "=============================================="
          Write-Host " RDP address: $ip"
          Write-Host " User: rdpuser"
          Write-Host " Connect with: mstsc /v:$ip"
          Write-Host "=============================================="

      - name: Keep alive (up to ~5h50m)
        shell: powershell
        run: |
          for ($i = 0; $i -lt 340; $i++) {
            Start-Sleep -Seconds 60
            if ($i % 30 -eq 0) { Write-Host "Still alive - $($i) min elapsed" }
          }
